name: Build Server x64
on:
  workflow_dispatch:
  push:
    branches:
      - "v2.11.8-hotfix-e3a2"
env:
  COMMIT: ${{ github.sha }}
  AWS_DEFAULT_REGION: "us-east-1"
  REPOSITORY_OWNER: ${{ github.repository_owner }}
  IMAGE: ${{ github.repository_owner }}/rancher
  TAG: v2.11.8
  VERSION: v2.11.8
jobs:
  build-server:
    runs-on: ubuntu-22.04
    env:
      ARCH: x64
      OS: linux
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - name: Checkout code
        uses: actions/checkout@v4
      - name: setup and build
        uses: ./.github/actions/build-images/server
  build-agent:
    runs-on: ubuntu-22.04
    env:
      ARCH: x64
      OS: linux
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - name: Checkout code
        uses: actions/checkout@v4
      - name: setup and build
        uses: ./.github/actions/build-images/agent
  push-image:
    needs: [build-server, build-agent]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    env:
      ARCH: x64
      OS: linux
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Convert arch to Docker arch
        shell: bash
        run: |
          if [[ "$ARCH" == "x64" ]]; then
            echo "DOCKER_ARCH=amd64" >> $GITHUB_ENV
          else
            echo "DOCKER_ARCH=$ARCH" >> $GITHUB_ENV
          fi
      - name: Download rancher image
        uses: actions/download-artifact@v4
        with:
          pattern: "rancher*-${{ env.OS }}-${{ env.ARCH }}"
          path: /tmp/rancher-artifacts
      - name: List downloaded artifacts
        shell: bash
        run: |
          echo "Downloaded artifacts:"
          ls -la /tmp/rancher-artifacts/ || echo "Directory not found"
          find /tmp/rancher-artifacts -type f 2>/dev/null || echo "No files found"
      - name: Setup Environment Variables
        uses: ./.github/actions/setup-tag-env
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push server image
        shell: bash
        run: |
          # 直接使用正确的文件路径 (artifact 会解压到子目录)
          tar_file="/tmp/rancher-artifacts/rancher-${{ env.OS }}-${{ env.ARCH }}/rancher-${{ env.OS }}-${{ env.ARCH }}.tar"
          
          if [ ! -f "$tar_file" ]; then
            echo "Error: Server tar file not found at $tar_file"
            echo "Searching for tar files..."
            find /tmp/rancher-artifacts -name "*.tar" -type f 2>/dev/null
            exit 1
          fi
          
          echo "Loading server image from: $tar_file"
          image_id=$(docker load --input "$tar_file" 2>&1 | grep "Loaded image" | awk '{print $NF}')
          if [ -z "$image_id" ]; then
            echo "Error: Failed to load image from tarball!"
            exit 1
          fi
          
          echo "Loaded server image: $image_id"
          docker tag "$image_id" ghcr.io/${{ github.repository_owner }}/rancher:${{ env.TAG }}-${{ env.ARCH }}
          docker push ghcr.io/${{ github.repository_owner }}/rancher:${{ env.TAG }}-${{ env.ARCH }}
      - name: Push agent image
        shell: bash
        run: |
          # 直接使用正确的文件路径 (artifact 会解压到子目录)
          tar_file="/tmp/rancher-artifacts/rancher-agent-${{ env.OS }}-${{ env.ARCH }}/rancher-agent-${{ env.OS }}-${{ env.ARCH }}.tar"
          
          if [ ! -f "$tar_file" ]; then
            echo "Error: Agent tar file not found at $tar_file"
            echo "Searching for agent tar files..."
            find /tmp/rancher-artifacts -name "*agent*.tar" -type f 2>/dev/null
            exit 1
          fi
          
          echo "Loading agent image from: $tar_file"
          image_id=$(docker load --input "$tar_file" 2>&1 | grep "Loaded image" | awk '{print $NF}')
          if [ -z "$image_id" ]; then
            echo "Error: Failed to load agent image from tarball!"
            exit 1
          fi
          
          echo "Loaded agent image: $image_id"
          docker tag "$image_id" ghcr.io/${{ github.repository_owner }}/rancher-agent:${{ env.TAG }}-${{ env.ARCH }}
          docker push ghcr.io/${{ github.repository_owner }}/rancher-agent:${{ env.TAG }}-${{ env.ARCH }}
  build-publish-chart:
    needs: [push-image]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      ARCH: amd64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: setup and build
        uses: ./.github/actions/rancher-chart/build
  build-installer:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    env:
      ARCH: x64
      OS: linux
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build
        uses: ./.github/actions/build-images/installer