name: Build Server x64
on:
  workflow_dispatch:
  push:
    branches:
      - "v2.11.8-hotfix-e3a2"
env:
  COMMIT: ${{ github.sha }}
  AWS_DEFAULT_REGION: "us-east-1"
  REPOSITORY_OWNER: ${{ github.repository_owner }}
  IMAGE: ${{ github.repository_owner }}/rancher
jobs:
  build-server:
    runs-on: ubuntu-22.04
    env:
      ARCH: x64
      OS: linux
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - name: Checkout code
        uses: actions/checkout@v4
      - name: setup and build
        uses: ./.github/actions/build-images/server
  build-agent:
    runs-on: ubuntu-22.04
    env:
      ARCH: x64
      OS: linux
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - name: Checkout code
        uses: actions/checkout@v4
      - name: setup and build
        uses: ./.github/actions/build-images/agent
  push-image:
    needs: [build-server, build-agent]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    env:
      ARCH: x64
      OS: linux
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Download rancher image
        uses: actions/download-artifact@v4
        with:
          pattern: "rancher*-${{ env.OS }}-${{ env.ARCH }}"
          path: /tmp
      - name: Setup Environment Variables
        uses: ./.github/actions/setup-tag-env
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push server image
        shell: bash
        run: |
          echo "Contents of /tmp:"
          ls -la /tmp/
          
          # 查找并解压 server zip 文件
          zip_file=$(find /tmp -name "rancher-linux-*.zip" -type f | grep -v agent | head -n 1)
          if [ -n "$zip_file" ]; then
            echo "Found server zip file: $zip_file"
            unzip -l "$zip_file"
            unzip "$zip_file" -d /tmp/
          fi
          
          # 查找 server tar 文件
          tar_file=$(find /tmp -name "rancher-linux-*.tar" -type f | grep -v agent | head -n 1)
          if [ -z "$tar_file" ]; then
            echo "Error: No server tar file found!"
            exit 1
          fi
          
          echo "Loading server image from: $tar_file"
          image_id=$(docker load --input "$tar_file" 2>&1 | grep "Loaded image" | awk '{print $NF}')
          if [ -z "$image_id" ]; then
            echo "Error: Failed to load image from tarball!"
            exit 1
          fi
          
          echo "Loaded server image: $image_id"
          docker tag "$image_id" ghcr.io/${{ github.repository_owner }}/rancher:${{ env.TAG }}-${{ env.ARCH }}
          docker push ghcr.io/${{ github.repository_owner }}/rancher:${{ env.TAG }}-${{ env.ARCH }}
      - name: Push agent image
        shell: bash
        run: |
          # 查找并解压 agent zip 文件
          zip_file=$(find /tmp -name "rancher-agent-*.zip" -type f | head -n 1)
          if [ -n "$zip_file" ]; then
            echo "Found agent zip file: $zip_file"
            unzip -l "$zip_file"
            unzip "$zip_file" -d /tmp/
          fi
          
          # 查找 agent tar 文件
          tar_file=$(find /tmp -name "rancher-agent-*.tar" -type f | head -n 1)
          if [ -z "$tar_file" ]; then
            echo "Error: No agent tar file found!"
            exit 1
          fi
          
          echo "Loading agent image from: $tar_file"
          image_id=$(docker load --input "$tar_file" 2>&1 | grep "Loaded image" | awk '{print $NF}')
          if [ -z "$image_id" ]; then
            echo "Error: Failed to load agent image from tarball!"
            exit 1
          fi
          
          echo "Loaded agent image: $image_id"
          docker tag "$image_id" ghcr.io/${{ github.repository_owner }}/rancher-agent:${{ env.TAG }}-${{ env.ARCH }}
          docker push ghcr.io/${{ github.repository_owner }}/rancher-agent:${{ env.TAG }}-${{ env.ARCH }}